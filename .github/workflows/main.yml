name: Platform IO CI
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build
        run: pio run