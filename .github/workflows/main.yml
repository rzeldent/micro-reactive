name: Platform IO CI
on: [push]
jobs:
  discover-examples:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.set-matrix.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - id: set-matrix
        name: Create example matrix
        run: |
          examples="$(find examples -type f -name '*.cpp' | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Run Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Run Unity tests
        run: pio test --environment native

  build:
    name: Build ${{ matrix.example }} (${{ matrix.environment }})
    needs: discover-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover-examples.outputs.examples) }}
        environment:
          - lolin_s2_mini
          - esp32-c3-devkitm-1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Stage example
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          mkdir -p src
          printf '#include "../%s"\n' "$EXAMPLE" > src/main.cpp
      - name: Build example
        run: pio run --environment "${{ matrix.environment }}"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - unit-tests
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Package examples
        run: zip -r examples.zip examples/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: examples.zip